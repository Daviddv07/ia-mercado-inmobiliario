name: Validar cuadernos
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install nbformat pandas scikit-learn joblib
      - run: python scripts/validate_notebooks.py
      - run: python scripts/check_pipeline.py
